name: Build Mobile (Android Tablet & iPad)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build WebAssembly Core & PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo & trunk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/trunk
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-trunk-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-trunk-

      - name: Install Trunk
        run: |
          if ! command -v trunk >/dev/null 2>&1; then
            curl -sL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.cargo/bin"
          fi

      - name: Build WebAssembly App
        run: |
          cd apps/wordcraft-web
          trunk build --release

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordpadx-web-dist
          path: dist/web

  build-android:
    name: Build Android Tablet APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: wordpadx-web-dist
          path: dist/web

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy Web Bundle into Android Assets
        run: |
          mkdir -p mobile/android/app/src/main/assets/www
          cp -R dist/web/. mobile/android/app/src/main/assets/www/

      - name: Build Android APK with Gradle
        run: |
          cd mobile/android
          gradle assembleDebug

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Wordpadx-Android-Tablet-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iPad / iOS App
    needs: build-web
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: wordpadx-web-dist
          path: dist/web

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          fi

      - name: Copy Web Bundle into iOS Project
        run: |
          mkdir -p mobile/ios/Wordpadx/www
          cp -R dist/web/. mobile/ios/Wordpadx/www/

      - name: Build with Xcode for iPad
        run: |
          cd mobile/ios
          xcodebuild \
            -project Wordpadx.xcodeproj \
            -scheme Wordpadx \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Archive iOS Build
        run: |
          cd mobile/ios
          mkdir -p build-output
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "Wordpadx.app" -exec cp -R {} build-output/ \; 2>/dev/null || true
          if [ -d build-output ]; then
            cd build-output
            zip -r ../Wordpadx-iPad.zip . || true
          fi

      - name: Upload iPad Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wordpadx-iPad-App
          path: mobile/ios/Wordpadx-iPad.zip
          if-no-files-found: ignore

  deploy-pages:
    name: Deploy PWA for Tablet Browsers
    needs: build-web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: wordpadx-web-dist
          path: dist/web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
