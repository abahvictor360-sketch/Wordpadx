name: Publish Mobile Build

on:
  workflow_run:
    workflows:
      - Build Mobile (Android Tablet & iPad)
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: Wordpadx-Android-Tablet-Debug-APK
          path: release-assets/android
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download iPad artifact
        uses: actions/download-artifact@v4
        with:
          name: Wordpadx-iPad-App
          path: release-assets/ios
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v0.5.0-build.${RUN_NUMBER}"
          gh release create "$tag" \
            release-assets/android/app-debug.apk#Wordpadx-Android-Tablet.apk \
            release-assets/ios/Wordpadx-iPad.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "Wordpadx build ${RUN_NUMBER}" \
            --notes "Automatically published from successful mobile build ${RUN_NUMBER}." \
            --prerelease
