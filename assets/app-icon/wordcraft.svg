<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Wordpadx</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d63ff"/>
      <stop offset="0.55" stop-color="#2f3fd6"/>
      <stop offset="1" stop-color="#6a32e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc24b"/>
      <stop offset="1" stop-color="#f28a10"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe5ff"/>
      <stop offset="1" stop-color="#b9c4f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#10164d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Page with a folded corner, tilted a little -->
  <g transform="rotate(-8 256 270)" filter="url(#shadow)">
    <path d="M136 112 h176 l72 72 v224 a20 20 0 0 1 -20 20 h-228 a20 20 0 0 1 -20 -20 v-276 a20 20 0 0 1 20 -20 z" fill="#ffffff"/>
    <path d="M312 112 v52 a20 20 0 0 0 20 20 h52 z" fill="url(#fold)"/>
    <!-- Lines of writing -->
    <rect x="162" y="208" width="132" height="22" rx="11" fill="#2f3fd6"/>
    <rect x="162" y="254" width="190" height="16" rx="8" fill="#c3cbef"/>
    <rect x="162" y="290" width="172" height="16" rx="8" fill="#c3cbef"/>
    <rect x="162" y="326" width="96" height="16" rx="8" fill="#c3cbef"/>
  </g>
  <!-- Pen nib writing the last line -->
  <g transform="translate(282 334) rotate(40)">
    <path d="M0 -150 h44 a10 10 0 0 1 10 10 v70 l-32 86 l-32 -86 v-70 a10 10 0 0 1 10 -10 z" fill="url(#nib)"/>
    <path d="M22 -36 v40" stroke="#8a3d00" stroke-width="5" stroke-linecap="round"/>
    <circle cx="22" cy="-40" r="8" fill="#8a3d00"/>
    <rect x="-10" y="-176" width="64" height="32" rx="10" fill="#1d257a"/>
  </g>
</svg>
