[package]
name = "wordcraft-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft import/export: plain text, Markdown, HTML, RTF, OpenDocument Text and LaTeX; PDF import"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-geom = { workspace = true }
image = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
# PDF import: reads pages, text with its fonts, and pictures.
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }

[dev-dependencies]
proptest = { workspace = true }
